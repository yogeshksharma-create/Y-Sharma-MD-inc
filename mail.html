html
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<form onsubmit="handleSubmit(event)" style="max-width:900px;margin:auto">

<h2>Email Center</h2>

<label>Email Type</label>
<select id="emailType">
  <option value="welcome">Welcome Email</option>
  <option value="announcement">Announcement</option>
  <option value="general">General Message</option>
</select>

<br><br>

<label>To</label>
<input id="to" placeholder="email1@test.com,email2@test.com">

<br><br>

<label>CC</label>
<input id="cc" placeholder="optional">

<br><br>

<label>BCC</label>
<input id="bcc" placeholder="optional">

<br><br>

<label>Subject</label>
<input id="subject">

<br><br>

<div id="editor" style="height:350px;background:white;"></div>

<button type="submit">Send Email</button>

</form>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script>
const quill = new Quill('#editor',{
  theme:'snow',
  modules:{
    toolbar:[
      ['bold','italic','underline'],
      [{header:[1,2,false]}],
      [{list:'ordered'},{list:'bullet'}],
      ['link'],
      ['clean']
    ]
  }
});

async function handleSubmit(e){

  e.preventDefault();

  const body = {
    type: document.getElementById('emailType').value,
    to: document.getElementById('to').value,
    cc: document.getElementById('cc').value,
    bcc: document.getElementById('bcc').value,
    subject: document.getElementById('subject').value,
    message: quill.root.innerHTML
  };

  const response = await fetch(
    "https://learnatopia-email.yogeshksharma.workers.dev",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify(body)
    }
  );

  if(response.ok){
    alert("Email Sent");
  }else{
    alert("Failed");
  }
}
</script>
