<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<form onsubmit="handleSubmit(event)" style="max-width:700px;margin:auto;">

  <div style="border:1px solid #ddd;border-radius:10px;overflow:hidden;background:white;">

    <!-- Header -->
    <div style="padding:12px;background:#f1f3f4;border-bottom:1px solid #ddd;">
      <b>New Message</b>
    </div>

    <!-- Fields -->
    <div style="padding:12px;display:flex;flex-direction:column;gap:10px;">

      <input name="name" placeholder="Name"
        style="padding:10px;border:1px solid #ccc;border-radius:6px;" />

      <input name="email" placeholder="Email"
        style="padding:10px;border:1px solid #ccc;border-radius:6px;" />

      <input name="subject" placeholder="Subject"
        style="padding:10px;border:1px solid #ccc;border-radius:6px;" />

      <!-- Gmail-style editor -->
      <div id="editor-wrapper" style="border:1px solid #ccc;border-radius:6px;">
  <div id="editor" style="height:300px;background:white;"></div>
</div>
      <!-- hidden field to send HTML -->
      <input type="hidden" name="message" id="messageInput" />

      <button type="submit"
        style="background:#1a73e8;color:white;padding:10px;border:none;border-radius:6px;cursor:pointer;">
        Send
      </button>

    </div>
  </div>
</form>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

<script>
  // Gmail-like rich text editor
  const quill = new Quill('#editor', {
    theme: 'snow',
    modules: {
      toolbar: [
        ['bold', 'italic', 'underline'],
        [{ header: [1, 2, false] }],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['link'],
        ['clean']
      ]
    }
  });

  async function handleSubmit(e) {
    e.preventDefault();

    const form = e.target;

    // convert editor content to HTML
    document.getElementById("messageInput").value = quill.root.innerHTML;

    await fetch("https://learnatopia-email.yogeshksharma.workers.dev", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: form.name.value,
        email: form.email.value,
        subject: form.subject.value,
        message: document.getElementById("messageInput").value
      })
    });

    alert("Message sent ✔");

    // reset UI
    form.reset();
    quill.setText("");
  }
</script>
